[project]
name = "vaani"
version = "0.1.0"
description = "Local voice-cloning audio generator"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "python-ulid>=3.0",
    "python-multipart>=0.0.9",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "coqui-tts[codec]>=0.27.5",
    # coqui-tts 0.27.5 imports transformers.pytorch_utils.isin_mps_friendly, removed in 5.x
    "transformers>=4.57,<5",
    "numpy>=2.4.6",
    "soundfile>=0.14.0",
    "librosa>=0.11.0",
    "mlx-whisper>=0.4.3",
    "speechbrain>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
vaani = "app.cli:main"
vaani-dev = "app.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends() in defaults is the framework idiom.
ignore = ["B008"]
